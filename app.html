<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SciLab – interactive science simulations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#eef3ee;--grid:#d9e3d9;--ink:#14213d;--mut:#56637a;--card:#fff;--line:#c4d1c4;--cop:#e4572e;--teal:#1b998b;--gold:#f2c14e;--sky:#3a86ff;--cv:#fbfdfb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a2b;--grid:#182640;--ink:#e8eefc;--mut:#9fb0cf;--card:#16233a;--line:#2a3b5c;--cv:#0c1524;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a2b;--grid:#182640;--ink:#e8eefc;--mut:#9fb0cf;--card:#16233a;--line:#2a3b5c;--cv:#0c1524;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Figtree,system-ui,sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;min-height:100vh}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;line-height:1.05}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:20px 20px 60px}
.brand{display:flex;align-items:center;gap:10px;font:800 26px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;text-decoration:none}
.logo{width:34px;height:34px}
.hero{padding:48px 0 28px;max-width:760px}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:800;letter-spacing:-.035em}
.hero p{font-size:19px;color:var(--mut);max-width:520px;margin:16px 0 0}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 22px}
.chip{border:2px solid var(--ink);background:transparent;color:var(--ink);padding:6px 14px;border-radius:99px;font:600 14px Figtree,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
input[type=search]{flex:1;min-width:160px;max-width:260px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--card);border:2px solid var(--ink);border-radius:6px 22px 6px 22px;overflow:hidden;text-decoration:none;box-shadow:5px 5px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.thumb{height:110px;border-bottom:2px solid var(--ink)}
.card div.b{padding:14px 16px 18px}
.card h3{font-size:22px;margin-bottom:4px}
.tag{font-size:13px;font-weight:600;color:var(--mut)}
.card p{margin:8px 0 0;font-size:15px;color:var(--mut)}
.foot{margin-top:48px;color:var(--mut);font-size:14px;max-width:640px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{font-weight:600;text-decoration:none;border:2px solid var(--ink);padding:6px 14px;border-radius:99px}
.back:hover{background:var(--ink);color:var(--bg)}
.sim{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin-top:20px}
@media(max-width:820px){.sim{grid-template-columns:1fr}}
.stage{background:var(--cv);border:2px solid var(--ink);border-radius:6px 22px 6px 22px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
canvas{display:block;width:100%;touch-action:none}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:22px 6px 22px 6px;padding:18px;display:flex;flex-direction:column;gap:14px;align-self:start}
.ctl label{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.copy{max-width:1120px;margin:0 auto;padding:0 20px 28px;color:var(--mut);font-size:14px}
.nb{color:var(--mut);font-weight:400;display:flex;align-items:center;gap:4px;white-space:nowrap}.num{width:78px;padding:3px 6px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--cop);font:700 14px Figtree,sans-serif;text-align:right}
input[type=range]{width:100%;accent-color:var(--cop)}
.btn{border:2px solid var(--ink);background:var(--gold);color:#14213d;font:700 15px Figtree,sans-serif;padding:8px 14px;border-radius:10px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink)}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.read{border-top:2px dashed var(--line);padding-top:12px;display:grid;gap:6px}
.read div{display:flex;justify-content:space-between;font-size:14px}
.read b{font-variant-numeric:tabular-nums}
.try{font-size:14px;color:var(--mut);margin:0;background:var(--bg);border-left:4px solid var(--teal);padding:8px 10px;border-radius:0 8px 8px 0}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head>
<body><div class="wrap" id="app"></div><footer class="copy">© Rohit Kattimani, 2026</footer>
<script>
const SUBJ={Physics:'#e4572e',Chemistry:'#1b998b',Electricity:'#3a86ff',Astronomy:'#7b5cd6',Biology:'#2f9e44',Math:'#d99a00'};
const R=(a,b)=>a+Math.random()*(b-a);
const SIMS=[
{id:'projectile',name:'Cannon Range',sub:'Physics',desc:'Aim the cannon, change gravity, and hit the moving-distance target.',
 try:'Try 45° first, then change gravity to see how the best angle holds.',
 ctl:[{k:'a',l:'Angle',min:5,max:85,v:45,u:'°',st:1},{k:'v',l:'Launch speed',min:10,max:45,v:30,u:' m/s',st:1},{k:'g',l:'Gravity',min:2,max:25,v:9.8,u:' m/s²',st:.1}],
 act:[{l:'Fire',f:(s,c)=>{s.tries++;s.shots.push({x:0,y:0,vx:c.v*Math.cos(c.a*Math.PI/180),vy:c.v*Math.sin(c.a*Math.PI/180),t:0,hm:0,tr:[],done:false})}},{l:'Clear',alt:1,f:s=>{s.shots=[];s.last=null}}],
 init:()=>({shots:[],score:0,tries:0,tx:R(50,200),last:null}),
 step(s,c,dt){for(const o of s.shots){if(o.done)continue;for(let i=0;i<4;i++){const h=dt/4;o.vy-=c.g*h;o.x+=o.vx*h;o.y+=o.vy*h;o.t+=h;o.hm=Math.max(o.hm,o.y);if(o.y<0){o.y=0;o.done=true;s.last=o;if(Math.abs(o.x-s.tx)<4)s.score++;break}}o.tr.push([o.x,o.y]);if(o.tr.length>600)o.tr.shift()}},
 draw(g,w,h,s,c,C){const k=(w-70)/250,x0=35,gy=h-40,X=m=>x0+m*k,Y=m=>gy-m*k;
  g.fillStyle=C.gnd;g.fillRect(0,gy,w,h-gy);g.strokeStyle=C.ink;g.lineWidth=2;g.beginPath();g.moveTo(0,gy);g.lineTo(w,gy);g.stroke();
  g.fillStyle=C.mut;g.font='12px Figtree';for(let m=0;m<=250;m+=50){g.fillText(m+' m',X(m)-12,gy+20)}
  g.fillStyle=C.cop;g.fillRect(X(s.tx-4),gy-6,8*k,6);g.fillStyle=C.gold;g.fillRect(X(s.tx-1.5),gy-6,3*k,6);
  for(const o of s.shots){g.fillStyle=C.teal;for(let i=0;i<o.tr.length;i+=6){g.beginPath();g.arc(X(o.tr[i][0]),Y(o.tr[i][1]),2,0,7);g.fill()}
   g.fillStyle=C.ink;g.beginPath();g.arc(X(o.x),Y(o.y),7,0,7);g.fill()}
  g.save();g.translate(x0,gy);g.rotate(-c.a*Math.PI/180);g.fillStyle=C.ink;g.fillRect(-8,-9,62,18);g.restore();
  g.fillStyle=C.cop;g.beginPath();g.arc(x0,gy,20,Math.PI,0);g.fill()},
 read:[['Range',s=>s.last?s.last.x.toFixed(1)+' m':'–'],['Peak height',s=>s.last?s.last.hm.toFixed(1)+' m':'–'],['Flight time',s=>s.last?s.last.t.toFixed(2)+' s':'–'],['Target hits',s=>s.score+' / '+s.tries]]},

{id:'pendulum',name:'Pendulum Playground',sub:'Physics',desc:'Drag the bob, then let go. Tune length, gravity and friction.',
 try:'Drag the bob to a small angle and note the period, then try a big angle.',
 ctl:[{k:'L',l:'String length',min:.4,max:2,v:1.2,u:' m',st:.05},{k:'g',l:'Gravity',min:2,max:25,v:9.8,u:' m/s²',st:.1},{k:'b',l:'Friction',min:0,max:1.5,v:.05,u:'',st:.01}],
 act:[{l:'Release from 60°',f:s=>{s.th=1.05;s.w=0;s.hist=[]}}],
 init:()=>({th:.9,w:0,drag:false,hist:[]}),
 step(s,c,dt){if(s.drag){s.hist.push(s.th);return}for(let i=0;i<8;i++){const h=dt/8;s.w+=(-c.g/c.L*Math.sin(s.th)-c.b*s.w)*h;s.th+=s.w*h}s.hist.push(s.th);if(s.hist.length>360)s.hist.shift()},
 draw(g,w,h,s,c,C){const px=w/2,py=40,len=c.L*170,bx=px+len*Math.sin(s.th),by=py+len*Math.cos(s.th);s.geo={px,py,len};
  g.strokeStyle=C.ink;g.lineWidth=3;g.beginPath();g.moveTo(px,py);g.lineTo(bx,by);g.stroke();
  g.strokeStyle=C.grid;g.setLineDash([5,6]);g.beginPath();g.moveTo(px,py);g.lineTo(px,py+len+30);g.stroke();g.setLineDash([]);
  g.fillStyle=C.ink;g.fillRect(px-40,py-10,80,10);
  g.fillStyle=s.drag?C.gold:C.cop;g.strokeStyle=C.ink;g.lineWidth=3;g.beginPath();g.arc(bx,by,20,0,7);g.fill();g.stroke();
  const gx=w-190,gy=70;g.strokeStyle=C.line;g.lineWidth=1;g.strokeRect(gx,gy-50,170,100);g.beginPath();g.moveTo(gx,gy);g.lineTo(gx+170,gy);g.stroke();
  g.strokeStyle=C.teal;g.lineWidth=2;g.beginPath();s.hist.forEach((a,i)=>{const x=gx+i/360*170,y=gy-a*28;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();
  g.fillStyle=C.mut;g.font='12px Figtree';g.fillText('angle over time',gx,gy+66)},
 pointer(s,x,y,type){const o=s.geo;if(!o)return;const bx=o.px+o.len*Math.sin(s.th),by=o.py+o.len*Math.cos(s.th);
  if(type=='down'&&Math.hypot(x-bx,y-by)<40){s.drag=true;s.w=0}
  if(s.drag&&type!='up'){s.th=Math.atan2(x-o.px,y-o.py);s.w=0}if(type=='up')s.drag=false},
 read:[['Period',(s,c)=>(2*Math.PI*Math.sqrt(c.L/c.g)).toFixed(2)+' s'],['Angle',s=>(s.th*180/Math.PI).toFixed(0)+'°'],['Speed',(s,c)=>Math.abs(s.w*c.L).toFixed(2)+' m/s']]},

{id:'gas',name:'Gas Chamber',sub:'Chemistry',desc:'Heat the gas, squeeze the piston and watch pressure respond.',
 try:'Halve the volume. Does the pressure double? Now raise the temperature.',
 ctl:[{k:'T',l:'Temperature',min:50,max:600,v:300,u:' K',st:5},{k:'n',l:'Particles',min:10,max:140,v:60,u:'',st:1},{k:'V',l:'Volume',min:25,max:100,v:100,u:'%',st:1}],
 act:[],
 init:()=>({p:[],P:0,imp:0,L:1}),
 step(s,c,dt,w,h){const W=w-80,H=h-80;s.L+=(c.V/100*W-s.L)*Math.min(1,dt*8);const L=s.L;
  while(s.p.length<c.n){const a=R(0,7);s.p.push({x:R(10,L-10),y:R(10,H-10),vx:Math.cos(a)*100,vy:Math.sin(a)*100})}s.p.length=c.n;
  let m=0;for(const q of s.p)m+=q.vx*q.vx+q.vy*q.vy;m/=s.p.length;const f=1+(Math.sqrt(196*c.T/m)-1)*Math.min(1,dt*3);
  let imp=0;for(const q of s.p){q.vx*=f;q.vy*=f;q.x+=q.vx*dt;q.y+=q.vy*dt;
   if(q.x<5){q.x=5;q.vx=Math.abs(q.vx)}if(q.x>L-5){q.x=L-5;q.vx=-Math.abs(q.vx);imp+=2*Math.abs(q.vx)}
   if(q.y<5){q.y=5;q.vy=Math.abs(q.vy)}if(q.y>H-5){q.y=H-5;q.vy=-Math.abs(q.vy)}}
  s.P+=((imp/dt/H)-s.P)*Math.min(1,dt*2);s.sp=Math.sqrt(m)},
 draw(g,w,h,s,c,C){const W=w-80,H=h-80,ox=40,oy=40;g.strokeStyle=C.ink;g.lineWidth=4;g.strokeRect(ox,oy,s.L,H);
  for(const q of s.p){const t=Math.min(1,Math.sqrt(q.vx*q.vx+q.vy*q.vy)/380);g.fillStyle=`hsl(${210-t*195},85%,55%)`;g.beginPath();g.arc(ox+q.x,oy+q.y,5,0,7);g.fill()}
  g.fillStyle=C.cop;g.fillRect(ox+s.L,oy-6,12,H+12);g.fillStyle=C.ink;g.fillRect(ox+s.L+12,oy+H/2-5,Math.max(0,W-s.L+20),10)},
 read:[['Pressure',s=>(s.P/9).toFixed(1)+' kPa'],['Avg speed',s=>(s.sp||0).toFixed(0)+' px/s'],['Volume',(s,c)=>c.V+'%']]},

{id:'wave',name:'Wave Rope',sub:'Physics',desc:'Shake one end of a rope and watch waves travel, bounce and fade.',
 try:'Turn off “fixed end” to see how reflections change. Then raise the frequency.',
 ctl:[{k:'f',l:'Frequency',min:.5,max:6,v:2,u:' Hz',st:.1},{k:'A',l:'Amplitude',min:10,max:70,v:40,u:' px',st:1},{k:'d',l:'Damping',min:0,max:.02,v:.002,u:'',st:.0005}],
 chk:[{k:'osc',l:'Shake the end',v:true},{k:'fix',l:'Fixed far end',v:true}],
 act:[{l:'Send pulse',f:(s,c)=>{for(let i=0;i<160;i++)s.y[i]+=c.A*Math.exp(-(((i-18)/5)**2))}},{l:'Calm rope',alt:1,f:s=>{s.y.fill(0);s.v.fill(0)}}],
 init:()=>({y:new Array(160).fill(0),v:new Array(160).fill(0),ph:0}),
 step(s,c,dt){const N=160,y=s.y,v=s.v;for(let k=0;k<Math.round(dt*180);k++){s.ph+=2*Math.PI*c.f/180;
  for(let i=1;i<N-1;i++)v[i]=(v[i]+.25*(y[i-1]-2*y[i]+y[i+1]))*(1-c.d);
  for(let i=1;i<N-1;i++)y[i]+=v[i];y[0]=c.osc?c.A*Math.sin(s.ph):0;y[N-1]=c.fix?0:y[N-2]}},
 draw(g,w,h,s,c,C){const N=160,X=i=>30+i/(N-1)*(w-60);g.strokeStyle=C.grid;g.lineWidth=1;g.beginPath();g.moveTo(30,h/2);g.lineTo(w-30,h/2);g.stroke();
  g.strokeStyle=C.teal;g.lineWidth=4;g.lineJoin='round';g.beginPath();s.y.forEach((y,i)=>{i?g.lineTo(X(i),h/2-y*2):g.moveTo(X(i),h/2-y*2)});g.stroke();
  g.fillStyle=C.cop;for(let i=0;i<N;i+=8){g.beginPath();g.arc(X(i),h/2-s.y[i]*2,5,0,7);g.fill()}
  g.fillStyle=C.ink;g.fillRect(14,h/2-s.y[0]*2-14,12,28);if(c.fix)g.fillRect(w-26,h/2-30,12,60)},
 read:[['Period',(s,c)=>(1/c.f).toFixed(2)+' s'],['Wavelength',(s,c)=>(90/c.f).toFixed(0)+' units'],['Wave speed','constant']]},

{id:'circuit',name:'Ohm’s Loop',sub:'Electricity',desc:'Change voltage and resistance and watch the electrons respond.',
 try:'Double the resistance at a fixed voltage. What happens to the current?',
 ctl:[{k:'V',l:'Battery voltage',min:0,max:12,v:6,u:' V',st:.5},{k:'Rr',l:'Resistance',min:1,max:100,v:10,u:' Ω',st:1}],
 act:[],
 init:()=>({e:Array.from({length:46},(_,i)=>i/46)}),
 step(s,c,dt){const I=c.V/c.Rr;s.e=s.e.map(u=>(u-I*.05*dt*(1+0)+1)%1)},
 draw(g,w,h,s,c,C){const x1=70,y1=90,x2=w-70,y2=h-90,Wd=x2-x1,Hd=y2-y1,P=2*(Wd+Hd),I=c.V/c.Rr,pw=c.V*c.V/c.Rr;
  g.strokeStyle=C.ink;g.lineWidth=4;g.strokeRect(x1,y1,Wd,Hd);
  g.clearRect(x1-30,h/2-40,60,80);g.fillStyle=C.cv;g.fillRect(x1-30,h/2-40,60,80);g.fillStyle=C.ink;g.fillRect(x1-24,h/2-14,48,6);g.fillRect(x1-12,h/2+8,24,6);g.font='700 18px Figtree';g.fillText('+',x1+34,h/2-8);g.fillText('−',x1+34,h/2+22);
  const rx=w/2-70,ry=y1;g.fillStyle=C.cv;g.fillRect(rx,ry-16,140,32);const gl=Math.min(1,pw/100);
  const gr=g.createRadialGradient(w/2,ry,5,w/2,ry,90);gr.addColorStop(0,`rgba(228,87,46,${.15+.8*gl})`);gr.addColorStop(1,'rgba(228,87,46,0)');g.fillStyle=gr;g.fillRect(rx-40,ry-80,220,160);
  g.strokeStyle=C.ink;g.lineWidth=4;g.beginPath();g.moveTo(rx,ry);for(let i=1;i<=8;i++)g.lineTo(rx+i*140/9,ry+(i%2?-14:14));g.lineTo(rx+140,ry);g.stroke();
  g.fillStyle=C.gold;g.strokeStyle=C.ink;g.lineWidth=2;for(const u of s.e){let d=u*P,x,y;if(d<Wd){x=x1+d;y=y1}else if(d<Wd+Hd){x=x2;y=y1+d-Wd}else if(d<2*Wd+Hd){x=x2-(d-Wd-Hd);y=y2}else{x=x1;y=y2-(d-2*Wd-Hd)}
   if(Math.abs(x-x1)<30&&Math.abs(y-h/2)<40)continue;g.beginPath();g.arc(x,y,6,0,7);g.fill();g.stroke()}
  g.fillStyle=C.mut;g.font='13px Figtree';g.fillText('electrons',x2-60,y2+26)},
 read:[['Current',(s,c)=>(c.V/c.Rr).toFixed(2)+' A'],['Power',(s,c)=>(c.V*c.V/c.Rr).toFixed(1)+' W'],['V = I × R',(s,c)=>c.V.toFixed(1)+' = '+(c.V/c.Rr).toFixed(2)+' × '+c.Rr]]}
];

const PH=c=>{const n=(c.ba-c.ac)*.1,k=Math.abs(n)/(50+c.ac+c.ba);if(k<1e-7)return 7;return Math.min(14,Math.max(0,n<0?-Math.log10(k):14+Math.log10(k)))};
const MORE=[
{id:'orbit',name:'Orbit Lab',sub:'Astronomy',desc:'Launch a planet around a star. Circle, ellipse or escape?',try:'Launch at about 80 for a near circle, then try 40 and 130.',
 th:'<ellipse cx="125" cy="55" rx="85" ry="38"/><circle cx="125" cy="55" r="10" fill="#f2c14e"/><circle cx="205" cy="45" r="6" fill="#7b5cd6"/>',
 ctl:[{k:'M',l:'Star mass',min:50,max:200,v:100,u:'',st:5},{k:'v',l:'Launch speed',min:20,max:160,v:80,u:' px/s',st:1}],
 act:[{l:'Launch',f:(s,c)=>Object.assign(s,{x:150,y:0,vx:0,vy:-c.v,tr:[],boom:false})}],
 init:()=>({x:150,y:0,vx:0,vy:-80,tr:[],boom:false}),
 step(s,c,dt){if(s.boom)return;const GM=c.M*1e4;for(let i=0;i<20;i++){const h=dt/20,r=Math.hypot(s.x,s.y);if(r<16){s.boom=true;return}const a=GM/(r*r*r);s.vx-=a*s.x*h;s.vy-=a*s.y*h;s.x+=s.vx*h;s.y+=s.vy*h}s.tr.push([s.x,s.y]);if(s.tr.length>700)s.tr.shift()},
 draw(g,w,h,s,c,C){const cx=w/2,cy=h/2;g.strokeStyle=C.teal;g.lineWidth=2;g.beginPath();s.tr.forEach((p,i)=>i?g.lineTo(cx+p[0],cy+p[1]):g.moveTo(cx+p[0],cy+p[1]));g.stroke();
  const gr=g.createRadialGradient(cx,cy,5,cx,cy,55);gr.addColorStop(0,C.gold);gr.addColorStop(1,'rgba(242,193,78,0)');g.fillStyle=gr;g.fillRect(cx-60,cy-60,120,120);g.fillStyle=C.gold;g.strokeStyle=C.ink;g.lineWidth=2;g.beginPath();g.arc(cx,cy,14,0,7);g.fill();g.stroke();
  g.fillStyle=s.boom?C.cop:C.ink;g.beginPath();g.arc(cx+s.x,cy+s.y,8,0,7);g.fill();if(s.boom){g.fillStyle=C.ink;g.font='700 16px Figtree';g.fillText('The planet hit the star. Press Launch.',20,34)}},
 read:[['Distance',s=>Math.hypot(s.x,s.y).toFixed(0)+' px'],['Speed',s=>Math.hypot(s.vx,s.vy).toFixed(0)+' px/s'],['Orbit',(s,c)=>(.5*(s.vx*s.vx+s.vy*s.vy)-c.M*1e4/Math.hypot(s.x,s.y))<0?'Bound':'Escapes']]},
